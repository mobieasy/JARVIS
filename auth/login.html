<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><meta name="csrf-token" content="__CSRF__"><title>Sign in · JARVIS</title>
<style nonce="__NONCE__">
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#eef5ff;background:#070d18;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px;background:radial-gradient(ellipse at 50% 5%,#132b42 0,transparent 58%),#070d18}.shell{width:100%;max-width:430px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:36px;font-size:18px;font-weight:650;letter-spacing:.16em}.orb{display:grid;place-items:center;width:38px;height:38px;border:1px solid #66d9ff88;border-radius:50%;color:#91e3ff;box-shadow:0 0 30px #38bdf824;font-size:14px;letter-spacing:0}.panel{background:#101a29d9;border:1px solid #28374b;border-radius:22px;padding:32px;box-shadow:0 24px 80px #0004}.eyebrow{color:#6ed6f6;font-size:11px;letter-spacing:.16em;font-weight:650;text-transform:uppercase}h1{font-size:28px;letter-spacing:-.035em;font-weight:600;margin:12px 0}p{font-size:14px;color:#9cabbe;line-height:1.65;margin:0 0 28px}label{display:block;font-size:13px;color:#cbd8e8;margin:0 0 10px}.phone{display:flex;border:1px solid #35445a;border-radius:11px;background:#0a1320;overflow:hidden;align-items:center}.prefix{padding:15px;color:#97a8be;border-right:1px solid #28374b;font-size:14px}input{font:inherit;color:#f1f5ff;width:100%;min-width:0;border:1px solid #35445a;border-radius:11px;background:#0a1320;padding:15px;outline:none}.phone input{border:0;border-radius:0}.phone:focus-within,input:focus{border-color:#5ac9f0;box-shadow:0 0 0 3px #38bdf814}input::placeholder{color:#53637a}.code{letter-spacing:.42em;text-align:center;font-size:24px;padding:13px;letter-spacing:.32em}button{font:inherit;cursor:pointer}.primary{margin-top:22px;width:100%;border:0;border-radius:11px;background:#83dafa;color:#071321;padding:15px;font-size:14px;font-weight:650;transition:background .15s}.primary:hover{background:#a4e7ff}.primary:disabled{opacity:.5;cursor:wait}.textbutton{background:none;border:0;color:#8bcfea;padding:10px 0;font-size:13px}.textbutton:disabled{color:#65768c;cursor:default}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px}.status{font-size:13px;line-height:1.6;color:#fdbaad;min-height:0;margin-top:16px}.status:empty{display:none}.footer{text-align:center;color:#67788f;font-size:11px;line-height:1.7;margin-top:24px}.hidden{display:none}.intro{margin-bottom:24px}.number{color:#dbe9f6;font-weight:500}@media(max-width:460px){body{padding:22px}.panel{padding:26px 22px}.brand{margin-bottom:28px}h1{font-size:26px}}
</style></head><body><main class="shell"><div class="brand"><span class="orb" aria-hidden="true">J</span>JARVIS</div><section class="panel"><div class="eyebrow">Your private workspace</div><h1 id="heading">Welcome back.</h1><p id="intro" class="intro">Sign in with your approved mobile number to continue.</p>
<form id="phone-form"><label for="phone">Mobile number</label><div class="phone"><span class="prefix">+91</span><input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="10" pattern="[6-9][0-9]{9}" placeholder="10-digit mobile number" required autofocus></div><button id="send" class="primary" type="submit">Send verification code</button></form>
<form id="code-form" class="hidden"><label for="code">Six-digit code</label><input id="code" class="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required><button id="verify" class="primary" type="submit">Verify and open JARVIS</button><div class="row"><button id="change" class="textbutton" type="button">Change number</button><button id="resend" class="textbutton" type="button" disabled>Resend in 60s</button></div></form>
<div id="status" class="status" role="status" aria-live="polite"></div></section><div class="footer">Codes expire in 5 minutes. Never share your code.<br>JARVIS · Private access</div></main>
<script nonce="__NONCE__">
const $=id=>document.getElementById(id);let challenge='',phone='',timer;
async function api(path,data){const response=await fetch(path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':document.querySelector('meta[name="csrf-token"]').content},body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw new Error(result.message||'Please try again.');return result}
function countdown(seconds){clearInterval(timer);$('resend').disabled=true;function tick(){if(seconds<=0){clearInterval(timer);$('resend').disabled=false;$('resend').textContent='Resend code';return}$('resend').textContent='Resend in '+seconds+'s';seconds--}tick();timer=setInterval(tick,1000)}
async function send(){const result=await api('/auth/request',{phone});challenge=result.challenge;$('phone-form').classList.add('hidden');$('code-form').classList.remove('hidden');$('heading').textContent='Check your messages.';$('intro').textContent='Enter the code sent to +91 '+phone+'.';$('code').value='';$('code').focus();countdown(result.retryAfter)}
$('phone-form').addEventListener('submit',async event=>{event.preventDefault();$('status').textContent='';$('send').disabled=true;$('send').textContent='Sending code…';phone=$('phone').value.trim();try{await send()}catch(error){$('status').textContent=error.message}finally{$('send').disabled=false;$('send').textContent='Send verification code'}});
$('code-form').addEventListener('submit',async event=>{event.preventDefault();$('status').textContent='';$('verify').disabled=true;$('verify').textContent='Verifying…';try{const result=await api('/auth/verify',{challenge,code:$('code').value.trim()});window.location.replace(result.redirect)}catch(error){$('status').textContent=error.message;$('verify').disabled=false;$('verify').textContent='Verify and open JARVIS'}});
$('change').addEventListener('click',()=>{clearInterval(timer);$('code-form').classList.add('hidden');$('phone-form').classList.remove('hidden');$('heading').textContent='Welcome back.';$('intro').textContent='Sign in with your approved mobile number to continue.';$('status').textContent='';$('phone').focus()});
$('resend').addEventListener('click',async()=>{$('status').textContent='';$('resend').disabled=true;try{await send()}catch(error){$('status').textContent=error.message;countdown(60)}});
</script></body></html>
