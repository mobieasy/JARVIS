name: Bug report
description: Report a reproducible problem without private data
title: "[Bug] "
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and environment
      description: Include OS/runtime versions. Remove credentials, phone numbers and personal data.
    validations:
      required: true
