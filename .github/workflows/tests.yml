name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s auth -p 'test_*.py' -v
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
      - run: python scripts/configure.py --workspace "$RUNNER_TEMP/jarvis-workspace" --output "$RUNNER_TEMP/openclaw.json"
